<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
    </style>
</head>

<body>
    <!-- 지도를 표시할 div 입니다 -->
<div id="map" style="width:100%;height:100vh;"></div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f53389072b4e97a8f83177bb6a04682d&libraries=clusterer"></script>
<script>
function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

var mapContainer = document.getElementById('map'), // 지도를 표시할 div
    mapOption = {
        center: new kakao.maps.LatLng(36.5, 127.8), // 지도의 중심좌표 (데이터 로드 후 캠핑장 범위로 재조정됨)
        level: 13 // 지도의 확대 레벨
    };

// 지도를 표시할 div와 지도 옵션으로 지도를 생성합니다
var map = new kakao.maps.Map(mapContainer, mapOption);

// 마커 클러스터러를 생성합니다
var clusterer = new kakao.maps.MarkerClusterer({
    map: map, // 마커들을 클러스터로 관리하고 표시할 지도 객체
    averageCenter: true, // 클러스터에 포함된 마커들의 평균 위치를 클러스터 마커 위치로 설정
    minLevel: 10 // 클러스터 할 최소 지도 레벨
    //지도 레벨이 10 이상(=10보다 더 축소된 상태)일 때만 마커들을 클러스터로 묶어서 표시하라는 뜻
});

fetch('basedList.json')
    .then(response => response.json())
    .then(data => {
        var items = (data.response && data.response.body && data.response.body.items && data.response.body.items.item) || [];
        var bounds = new kakao.maps.LatLngBounds();

        var clusterMarkers = items.map(function (item) {
            var position = new kakao.maps.LatLng(parseFloat(item.mapY), parseFloat(item.mapX));
            bounds.extend(position);

            // 마커를 생성합니다 (클러스터러가 관리할 마커는 map을 지정하지 않습니다)
            var marker = new kakao.maps.Marker({
                position: position, // 마커를 표시할 위치
                title: item.facltNm // 마커의 타이틀, 마커에 마우스를 올리면 타이틀이 표시됩니다
            });

            // 마커를 클릭했을 때 마커 위에 표시할 인포윈도우를 생성합니다
            var iwContent = '<div style="padding:5px;">' +
                '<strong>' + escapeHtml(item.facltNm) + '</strong><br>' +
                escapeHtml(item.addr1) +
                (item.tel ? '<br>' + escapeHtml(item.tel) : '') +
                (item.homepage ? '<br><a href="' + escapeHtml(item.homepage) + '" target="_blank">' + escapeHtml(item.homepage) + '</a>' : '') +
                '</div>';

            // 인포윈도우를 생성합니다
            var infowindow = new kakao.maps.InfoWindow({
                content: iwContent,
                removable: true // removeable 속성을 true 로 설정하면 인포윈도우를 닫을 수 있는 x버튼이 표시됩니다
            });

            // 마커에 클릭이벤트를 등록합니다
            kakao.maps.event.addListener(marker, 'click', function () {
                // 마커 위에 인포윈도우를 표시합니다
                infowindow.open(map, marker);
            });

            return marker;
        });

        // 클러스터러에 마커들을 추가합니다
        clusterer.addMarkers(clusterMarkers);

        if (clusterMarkers.length > 0) {
            map.setBounds(bounds);
        }
    })
    .catch(error => {
        console.error('Error:', error);
    });
</script>
</body>
</html>
